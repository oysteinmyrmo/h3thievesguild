[workspace]
resolver = "3"
members = ["crates/h3save"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Tests parse many saves; optimise them, but keep overflow checks and debug assertions so
# arithmetic overflow still fails a test.
[profile.test]
opt-level = 2
