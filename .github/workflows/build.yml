name: build-and-test
# Every push builds and tests on Linux, where Actions minutes are cheapest. The other platforms
# (Windows minutes count twice, macOS ten times on a private repository) only run when started by
# hand: Actions > build-and-test > Run workflow.
on:
  push:
    # A push that only changes documentation needs no build.
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
# A newer push to the same branch stops the run still going for the older one, except on main,
# where it waits, so that a deployment of the site is never stopped halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# Read only, except for the deploy job below.
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: Linux x64
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Build
        run: cargo build --release --all-targets
      - name: Test
        run: cargo test --release
      - name: Build WebAssembly
        run: cargo build --release -p h3wasm --target wasm32-unknown-unknown

  platforms:
    name: ${{ matrix.config.name }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
          name: "Windows x64 (MSVC)",
          os: windows-latest,
          toolchain: "stable-x86_64-pc-windows-msvc"
        }
        - {
          name: "Windows x64 (GNU)",
          os: windows-latest,
          toolchain: "stable-x86_64-pc-windows-gnu"
        }
        - {
          name: "Windows arm64 (MSVC)",
          os: windows-11-arm,
          toolchain: "stable"
        }
        - {
          name: "MacOS arm64",
          os: macos-latest,
          toolchain: "stable"
        }
        - {
          name: "MacOS x64",
          os: macos-15-intel,
          toolchain: "stable"
        }
        - {
          name: "Linux arm64",
          os: ubuntu-26.04-arm,
          toolchain: "stable"
        }
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.config.toolchain }}
          targets: wasm32-unknown-unknown
      - name: Build
        shell: bash
        run: cargo build --release --all-targets
      - name: Test
        shell: bash
        run: cargo test --release
      - name: Build WebAssembly
        shell: bash
        run: cargo build --release -p h3wasm --target wasm32-unknown-unknown

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (WebAssembly)
        run: cargo clippy -p h3wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    name: WebAssembly tests
    runs-on: ubuntu-26.04
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/install-wasm-bindgen
      - name: Test in Node.js
        run: cargo test -p h3wasm --target wasm32-unknown-unknown
      - name: Generate the JavaScript bindings
        run: |
          cargo build --release -p h3wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/h3wasm.wasm
          grep -q "finish(): Dataset;" pkg/h3wasm.d.ts
      - name: Check the size
        run: |
          size=$(gzip -9 -c pkg/h3wasm_bg.wasm | wc -c)
          echo "h3wasm_bg.wasm is $size bytes gzipped"
          # About 100 kB today. Fail if it grows past 500 kB, which would slow page loads.
          test "$size" -le 500000

  web:
    name: Web frontend
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/install-wasm-bindgen
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install packages
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        run: npm run test:e2e
      # The site is deployed from pushes to main only, by the deploy job below.
      - name: Build the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build
      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  # Publishes the site built by the web job to GitHub Pages, once every test has passed.
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, lint, wasm, web]
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
