[package]
name = "h3wasm"
description = "WebAssembly bindings: build a plotting data set from Heroes 3 HotA save files in the browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
h3dataset = { path = "../h3dataset", features = ["typescript"] }
js-sys = "0.3"
serde = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1"
wasm-bindgen-test = "0.3"

[lints]
workspace = true
